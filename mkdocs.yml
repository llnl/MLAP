site_name: MLAP
site_description: >-
  Machine Learning Automation Pipeline for wildfire fuel moisture prediction
site_url: https://llnl.github.io/MLAP/
repo_url: https://github.com/LLNL/MLAP
repo_name: LLNL/MLAP
copyright: >-
  Pankaj K. Jha &middot; Lawrence Livermore National Laboratory &middot;
  <a href="https://github.com/LLNL/MLAP">github.com/LLNL/MLAP</a> &middot;
  MIT License &middot; LLNL-CODE-2001016

docs_dir: docs

validation:
  links:
    anchors: warn
    absolute_links: info
    unrecognized_links: warn

theme:
  name: material
  features:
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - search.highlight
    - search.suggest
    - toc.integrate
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.blocks.caption
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search

nav:
  - Home: index.md
  - Design Assessment: design-assessment.md
  - User Guide:
      - Getting Started:
          - Installation: user-guide/installation.md
          - Running on HPC: user-guide/running-on-hpc.md
      - Pipeline Steps:
          - "Step 1: Extract Data": user-guide/step1-extract.md
          - "Step 2: Prepare Data": user-guide/step2-prepare.md
          - "Step 3: Train Models": user-guide/step3-train.md
          - "Step 4: Evaluate Models": user-guide/step4-evaluate.md
          - "Step 5: Analyze and Predict": user-guide/step5-analyze.md
      - Reference:
          - JSON Reference: user-guide/json-reference.md
  - Science:
      - Overview: science/overview.md
      - Assessments:
          - Data Sampling: science/data-sampling.md
          - Historical Data: science/history.md
          - ML Parameters: science/ml-parameters.md
          - Physical Quantities: science/physical-quantities.md
  - Development:
      - Contributing: development/contributing.md
